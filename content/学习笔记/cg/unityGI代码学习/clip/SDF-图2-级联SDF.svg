<svg viewBox="0 0 1000 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sdf-cascade-title sdf-cascade-desc">
  <title id="sdf-cascade-title">级联 SDF 同心圆区域</title>
  <desc id="sdf-cascade-desc">三个嵌套的同心方框表示三级 Cascade：近处高精度、中距离中精度、远处低精度，中心为相机位置。</desc>
  <defs>
    <marker id="cas-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#4f5d75"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#f5f5f5"/>

  
  <rect x="100" y="40" width="800" height="280" rx="8" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.20)" stroke-width="1.3"/>
  <rect x="396" y="44" width="208" height="16" rx="2" fill="#f5f5f5"/>
  <text x="500" y="56" fill="rgba(45,49,66,0.45)" font-size="11" font-weight="500" font-family="'Consolas', 'Microsoft YaHei', monospace" text-anchor="middle" letter-spacing="0.14em">FAR · 低精度 · 64~256m</text>

  
  <rect x="220" y="100" width="560" height="180" rx="8" fill="rgba(45,49,66,0.04)" stroke="rgba(45,49,66,0.30)" stroke-width="1.3"/>
  <rect x="380" y="104" width="240" height="16" rx="2" fill="#f5f5f5"/>
  <text x="500" y="116" fill="rgba(45,49,66,0.50)" font-size="11" font-weight="500" font-family="'Consolas', 'Microsoft YaHei', monospace" text-anchor="middle" letter-spacing="0.14em">MID · 中精度 · 16~64m</text>

  
  <rect x="340" y="160" width="320" height="80" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.6"/>
  <rect x="392" y="164" width="216" height="16" rx="2" fill="#f5f5f5"/>
  <text x="500" y="176" fill="#eb6c36" font-size="11" font-weight="500" font-family="'Consolas', 'Microsoft YaHei', monospace" text-anchor="middle" letter-spacing="0.14em">NEAR · 高精度 · 0~16m</text>

  
  <circle cx="500" cy="200" r="8" fill="#2d3142"/>
  <text x="500" y="224" fill="#2d3142" font-size="12" font-weight="600" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" text-anchor="middle">相机</text>

  
  <line x1="508" y1="200" x2="660" y2="200" stroke="#eb6c36" stroke-width="1.8" marker-end="url(#cas-arrow)"/>
  <line x1="660" y1="200" x2="780" y2="200" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#cas-arrow)"/>
  <line x1="780" y1="200" x2="880" y2="200" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#cas-arrow)"/>

  
  <rect x="636" y="184" width="48" height="16" rx="2" fill="#f5f5f5"/>
  <text x="660" y="196" fill="#eb6c36" font-size="10" font-weight="500" font-family="'Consolas', 'Microsoft YaHei', monospace" text-anchor="middle" letter-spacing="0.06em">SWITCH</text>
  <rect x="756" y="184" width="48" height="16" rx="2" fill="#f5f5f5"/>
  <text x="780" y="196" fill="#4f5d75" font-size="10" font-weight="500" font-family="'Consolas', 'Microsoft YaHei', monospace" text-anchor="middle" letter-spacing="0.06em">SWITCH</text>

  
  <text x="48" y="56" fill="#7a8399" font-size="11" font-weight="500" font-family="'Consolas', 'Microsoft YaHei', monospace" letter-spacing="0.14em">PRECISION</text>
  <text x="48" y="80" fill="#eb6c36" font-size="12" font-weight="600" font-family="'Consolas', 'Microsoft YaHei', monospace">high</text>
  <text x="48" y="280" fill="#4f5d75" font-size="12" font-family="'Consolas', 'Microsoft YaHei', monospace">low</text>
  <line x1="64" y1="88" x2="64" y2="268" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#cas-arrow)"/>

  
  <line x1="100" y1="348" x2="900" y2="348" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
  <text x="100" y="368" fill="#4f5d75" font-size="11" font-weight="500" font-family="'Consolas', 'Microsoft YaHei', monospace" letter-spacing="0.18em">LEGEND</text>

  <rect x="200" y="358" width="16" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.3"/>
  <text x="224" y="368" fill="#4f5d75" font-size="11" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif">近处 Cascade（高精度）</text>

  <rect x="400" y="358" width="16" height="12" rx="2" fill="rgba(45,49,66,0.04)" stroke="rgba(45,49,66,0.30)" stroke-width="1.3"/>
  <text x="424" y="368" fill="#4f5d75" font-size="11" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif">中距离 Cascade</text>

  <rect x="560" y="358" width="16" height="12" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.20)" stroke-width="1.3"/>
  <text x="584" y="368" fill="#4f5d75" font-size="11" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif">远处 Cascade（低精度）</text>

  <line x1="780" y1="364" x2="808" y2="364" stroke="#eb6c36" stroke-width="1.8" marker-end="url(#cas-arrow)"/>
  <text x="816" y="368" fill="#4f5d75" font-size="11" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif">射线追踪</text>
</svg>
