<svg viewBox="0 0 1000 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sh-pyramid-title sh-pyramid-desc">
  <title id="sh-pyramid-title">球谐函数阶数金字塔</title>
  <desc id="sh-pyramid-desc">金字塔图展示球谐函数从 L0 到 L3 四个阶层的系数数量递增，L2 为 TuanjieGI 使用的阶层。</desc>
  <defs>
    <marker id="py-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#4f5d75"/>
    </marker>
    <style>
      .sans  { font-family: 'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif; }
      .mono  { font-family: 'Consolas', 'Microsoft YaHei', ui-monospace, monospace; }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="#f5f5f5"/>

  
  <text x="960" y="56" fill="#7a8399" font-size="11" font-weight="500" font-family="'Consolas', 'Microsoft YaHei', monospace" text-anchor="end" letter-spacing="0.14em">FORMULA</text>
  <text x="960" y="80" fill="#2d3142" font-size="16" font-weight="600" font-family="'Consolas', 'Microsoft YaHei', monospace" text-anchor="end">(n+1)²</text>
  <text x="960" y="100" fill="#4f5d75" font-size="12" font-family="'Consolas', 'Microsoft YaHei', monospace" text-anchor="end">n = degree</text>

  
  <text x="36" y="56" fill="#7a8399" font-size="11" font-weight="500" font-family="'Consolas', 'Microsoft YaHei', monospace" letter-spacing="0.14em">FREQUENCY</text>
  <text x="36" y="80" fill="#4f5d75" font-size="12" font-family="'Consolas', 'Microsoft YaHei', monospace">low</text>
  <text x="36" y="320" fill="#4f5d75" font-size="12" font-family="'Consolas', 'Microsoft YaHei', monospace">high</text>
  <line x1="56" y1="88" x2="56" y2="304" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#py-arrow)"/>

  
  <polygon points="416,40 584,40 604,100 396,100" fill="#ffffff" stroke="#2d3142" stroke-width="1.3"/>
  <rect x="420" y="46" width="36" height="16" rx="2" fill="transparent" stroke="rgba(45,49,66,0.45)" stroke-width="1"/>
  <text x="438" y="58" fill="#2d3142" font-size="10" font-weight="600" font-family="'Consolas', 'Microsoft YaHei', monospace" text-anchor="middle" letter-spacing="0.08em">L0</text>
  <text x="500" y="76" fill="#2d3142" font-size="16" font-weight="600" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" text-anchor="middle">1 coefficient</text>
  <text x="500" y="92" fill="#4f5d75" font-size="12" font-family="'Consolas', 'Microsoft YaHei', monospace" text-anchor="middle">整体亮度 · average</text>

  
  <polygon points="328,108 672,108 700,168 300,168" fill="#ffffff" stroke="#2d3142" stroke-width="1.3"/>
  <rect x="332" y="114" width="36" height="16" rx="2" fill="transparent" stroke="rgba(45,49,66,0.45)" stroke-width="1"/>
  <text x="350" y="126" fill="#2d3142" font-size="10" font-weight="600" font-family="'Consolas', 'Microsoft YaHei', monospace" text-anchor="middle" letter-spacing="0.08em">L1</text>
  <text x="500" y="144" fill="#2d3142" font-size="16" font-weight="600" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" text-anchor="middle">4 coefficients</text>
  <text x="500" y="160" fill="#4f5d75" font-size="12" font-family="'Consolas', 'Microsoft YaHei', monospace" text-anchor="middle">方向趋势 · directional trend</text>

  
  <polygon points="224,176 776,176 804,236 196,236" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.6"/>
  <rect x="232" y="182" width="36" height="16" rx="2" fill="transparent" stroke="rgba(235,108,54,0.55)" stroke-width="1"/>
  <text x="250" y="194" fill="#eb6c36" font-size="10" font-weight="600" font-family="'Consolas', 'Microsoft YaHei', monospace" text-anchor="middle" letter-spacing="0.08em">L2</text>
  <text x="500" y="212" fill="#2d3142" font-size="16" font-weight="600" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" text-anchor="middle">9 coefficients</text>
  <text x="500" y="228" fill="#eb6c36" font-size="12" font-weight="500" font-family="'Consolas', 'Microsoft YaHei', monospace" text-anchor="middle">漫反射间接光 · TuanjieGI uses this</text>

  
  <polygon points="124,244 876,244 904,304 96,304" fill="#ffffff" stroke="#2d3142" stroke-width="1.3"/>
  <rect x="132" y="250" width="36" height="16" rx="2" fill="transparent" stroke="rgba(45,49,66,0.45)" stroke-width="1"/>
  <text x="150" y="262" fill="#2d3142" font-size="10" font-weight="600" font-family="'Consolas', 'Microsoft YaHei', monospace" text-anchor="middle" letter-spacing="0.08em">L3</text>
  <text x="500" y="280" fill="#2d3142" font-size="16" font-weight="600" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" text-anchor="middle">16 coefficients</text>
  <text x="500" y="296" fill="#4f5d75" font-size="12" font-family="'Consolas', 'Microsoft YaHei', monospace" text-anchor="middle">高频细节 · overkill for diffuse</text>

  
  <line x1="96" y1="324" x2="904" y2="324" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
  <text x="96" y="344" fill="#4f5d75" font-size="11" font-weight="500" font-family="'Consolas', 'Microsoft YaHei', monospace" letter-spacing="0.18em">LEGEND</text>

  <rect x="192" y="334" width="16" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.3"/>
  <text x="216" y="344" fill="#4f5d75" font-size="11" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif">TuanjieGI uses (L2)</text>

  <rect x="392" y="334" width="16" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1.3"/>
  <text x="416" y="344" fill="#4f5d75" font-size="11" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif">Other degrees</text>
</svg>
