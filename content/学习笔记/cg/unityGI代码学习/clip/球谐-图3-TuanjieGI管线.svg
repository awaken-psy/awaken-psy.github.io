<svg viewBox="0 0 1000 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sh-pipeline-title sh-pipeline-desc">
  <title id="sh-pipeline-title">TuanjieGI 单帧球谐管线</title>
  <desc id="sh-pipeline-desc">流程图展示 TuanjieGI 一帧中球谐的 5 个步骤，分为 Build 阶段（追踪→编码→存储）和 Render 阶段（解码→输出）。</desc>
  <defs>
    <marker id="pl-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#4f5d75"/>
    </marker>
    <marker id="pl-arrow-accent" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#eb6c36"/>
    </marker>
    <style>
      .sans  { font-family: 'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif; }
      .mono  { font-family: 'Consolas', 'Microsoft YaHei', ui-monospace, monospace; }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="#f5f5f5"/>

  
  <rect x="48" y="48" width="580" height="172" rx="8"
        fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
  <rect x="260" y="52" width="156" height="16" rx="2" fill="#f5f5f5"/>
  <text x="338" y="64" fill="rgba(45,49,66,0.45)" font-size="10" font-weight="500" font-family="'Consolas', 'Microsoft YaHei', monospace"
        text-anchor="middle" letter-spacing="0.14em">BUILD PHASE</text>

  
  <rect x="648" y="48" width="304" height="172" rx="8"
        fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
  <rect x="736" y="52" width="128" height="16" rx="2" fill="#f5f5f5"/>
  <text x="800" y="64" fill="rgba(45,49,66,0.45)" font-size="10" font-weight="500" font-family="'Consolas', 'Microsoft YaHei', monospace"
        text-anchor="middle" letter-spacing="0.14em">RENDER PHASE</text>

  
  <line x1="212" y1="124" x2="240" y2="124" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#pl-arrow)"/>
  <line x1="376" y1="124" x2="404" y2="124" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#pl-arrow)"/>
  <line x1="604" y1="124" x2="660" y2="124" stroke="#eb6c36" stroke-width="1.8" marker-end="url(#pl-arrow-accent)"/>
  <line x1="792" y1="124" x2="820" y2="124" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#pl-arrow)"/>

  
  <rect x="206" y="104" width="40" height="16" rx="2" fill="#f5f5f5"/>
  <text x="226" y="116" fill="#4f5d75" font-size="11" font-weight="500" font-family="'Consolas', 'Microsoft YaHei', monospace" text-anchor="middle" letter-spacing="0.06em">PROJECT</text>

  <rect x="372" y="104" width="32" height="16" rx="2" fill="#f5f5f5"/>
  <text x="388" y="116" fill="#4f5d75" font-size="11" font-weight="500" font-family="'Consolas', 'Microsoft YaHei', monospace" text-anchor="middle" letter-spacing="0.06em">STORE</text>

  <rect x="608" y="104" width="40" height="16" rx="2" fill="#f5f5f5"/>
  <text x="628" y="116" fill="#eb6c36" font-size="11" font-weight="500" font-family="'Consolas', 'Microsoft YaHei', monospace" text-anchor="middle" letter-spacing="0.06em">EVAL</text>

  
  <rect x="64" y="92" width="148" height="64" rx="6" fill="#f5f5f5"/>
  <rect x="64" y="92" width="148" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1.3"/>
  <rect x="72" y="100" width="36" height="16" rx="2" fill="transparent" stroke="rgba(122,131,153,0.45)" stroke-width="1"/>
  <text x="90" y="112" fill="#7a8399" font-size="10" font-weight="600" font-family="'Consolas', 'Microsoft YaHei', monospace" text-anchor="middle" letter-spacing="0.08em">RAY</text>
  <text x="138" y="130" fill="#2d3142" font-size="16" font-weight="600" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" text-anchor="middle">Ray Trace Hit</text>
  <text x="138" y="148" fill="#4f5d75" font-size="12" font-family="'Consolas', 'Microsoft YaHei', monospace" text-anchor="middle">read color + normal</text>

  
  <rect x="240" y="92" width="136" height="64" rx="6" fill="#f5f5f5"/>
  <rect x="240" y="92" width="136" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.3"/>
  <rect x="248" y="100" width="44" height="16" rx="2" fill="transparent" stroke="rgba(45,49,66,0.45)" stroke-width="1"/>
  <text x="270" y="112" fill="#2d3142" font-size="10" font-weight="600" font-family="'Consolas', 'Microsoft YaHei', monospace" text-anchor="middle" letter-spacing="0.08em">ENC</text>
  <text x="308" y="130" fill="#2d3142" font-size="16" font-weight="600" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" text-anchor="middle">Encode</text>
  <text x="308" y="148" fill="#4f5d75" font-size="12" font-family="'Consolas', 'Microsoft YaHei', monospace" text-anchor="middle">project to 9 coef</text>

  
  <rect x="404" y="92" width="200" height="64" rx="6" fill="#f5f5f5"/>
  <rect x="404" y="92" width="200" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1.3"/>
  <rect x="412" y="100" width="36" height="16" rx="2" fill="transparent" stroke="rgba(79,93,117,0.55)" stroke-width="1"/>
  <text x="430" y="112" fill="#4f5d75" font-size="10" font-weight="600" font-family="'Consolas', 'Microsoft YaHei', monospace" text-anchor="middle" letter-spacing="0.08em">TEX</text>
  <text x="504" y="130" fill="#2d3142" font-size="16" font-weight="600" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" text-anchor="middle">Store / Accumulate</text>
  <text x="504" y="148" fill="#4f5d75" font-size="12" font-family="'Consolas', 'Microsoft YaHei', monospace" text-anchor="middle">IndIrradiance · multi-frame</text>

  
  <rect x="660" y="92" width="132" height="64" rx="6" fill="#f5f5f5"/>
  <rect x="660" y="92" width="132" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.3"/>
  <rect x="668" y="100" width="44" height="16" rx="2" fill="transparent" stroke="rgba(235,108,54,0.55)" stroke-width="1"/>
  <text x="690" y="112" fill="#eb6c36" font-size="10" font-weight="600" font-family="'Consolas', 'Microsoft YaHei', monospace" text-anchor="middle" letter-spacing="0.08em">DEC</text>
  <text x="726" y="130" fill="#2d3142" font-size="16" font-weight="600" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" text-anchor="middle">Decode</text>
  <text x="726" y="148" fill="#4f5d75" font-size="12" font-family="'Consolas', 'Microsoft YaHei', monospace" text-anchor="middle">Evaluate(bentNormal)</text>

  
  <rect x="820" y="92" width="120" height="64" rx="6" fill="#f5f5f5"/>
  <rect x="820" y="92" width="120" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.3"/>
  <rect x="828" y="100" width="36" height="16" rx="2" fill="transparent" stroke="rgba(45,49,66,0.45)" stroke-width="1"/>
  <text x="846" y="112" fill="#2d3142" font-size="10" font-weight="600" font-family="'Consolas', 'Microsoft YaHei', monospace" text-anchor="middle" letter-spacing="0.08em">OUT</text>
  <text x="880" y="130" fill="#2d3142" font-size="16" font-weight="600" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" text-anchor="middle">Output</text>
  <text x="880" y="148" fill="#4f5d75" font-size="12" font-family="'Consolas', 'Microsoft YaHei', monospace" text-anchor="middle">indirect light</text>

  
  <line x1="48" y1="240" x2="952" y2="240" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
  <text x="48" y="260" fill="#4f5d75" font-size="11" font-weight="500" font-family="'Consolas', 'Microsoft YaHei', monospace" letter-spacing="0.18em">LEGEND</text>

  <rect x="148" y="250" width="16" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.3"/>
  <text x="172" y="260" fill="#4f5d75" font-size="11" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif">Decode (focal)</text>

  <rect x="300" y="250" width="16" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1.3"/>
  <text x="324" y="260" fill="#4f5d75" font-size="11" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif">Process</text>

  <rect x="412" y="250" width="16" height="12" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1.3"/>
  <text x="436" y="260" fill="#4f5d75" font-size="11" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif">Storage</text>

  <rect x="516" y="250" width="16" height="12" rx="2" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1.3"/>
  <text x="540" y="260" fill="#4f5d75" font-size="11" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif">Input</text>

  <line x1="616" y1="258" x2="648" y2="258" stroke="#eb6c36" stroke-width="1.8" marker-end="url(#pl-arrow-accent)"/>
  <text x="656" y="260" fill="#4f5d75" font-size="11" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif">Primary flow (Build → Render)</text>
</svg>
