<svg viewBox="0 0 1000 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sdf-pipeline-title sdf-pipeline-desc">
  <title id="sdf-pipeline-title">TuanjieGI 三级加速链路</title>
  <desc id="sdf-pipeline-desc">数据流图展示从场景三角形到 Facet 场景、SDF 场景、级联 SDF 的三级处理流水线。</desc>
  <defs>
    <marker id="pl3-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#4f5d75"/>
    </marker>
    <marker id="pl3-arrow-accent" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#eb6c36"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#f5f5f5"/>

  
  <line x1="212" y1="64" x2="256" y2="64" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#pl3-arrow)"/>
  <line x1="464" y1="64" x2="508" y2="64" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#pl3-arrow)"/>
  <line x1="716" y1="64" x2="760" y2="64" stroke="#eb6c36" stroke-width="1.8" marker-end="url(#pl3-arrow-accent)"/>

  
  <rect x="196" y="44" width="76" height="16" rx="2" fill="#f5f5f5"/>
  <text x="234" y="56" fill="#4f5d75" font-size="11" font-weight="500" font-family="'Consolas', 'Microsoft YaHei', monospace" text-anchor="middle" letter-spacing="0.06em">RASTERIZE</text>

  <rect x="452" y="44" width="68" height="16" rx="2" fill="#f5f5f5"/>
  <text x="486" y="56" fill="#4f5d75" font-size="11" font-weight="500" font-family="'Consolas', 'Microsoft YaHei', monospace" text-anchor="middle" letter-spacing="0.06em">BUILD SDF</text>

  <rect x="700" y="44" width="76" height="16" rx="2" fill="#f5f5f5"/>
  <text x="738" y="56" fill="#eb6c36" font-size="11" font-weight="500" font-family="'Consolas', 'Microsoft YaHei', monospace" text-anchor="middle" letter-spacing="0.06em">CASCADE</text>

  
  <rect x="48" y="32" width="164" height="64" rx="6" fill="#f5f5f5"/>
  <rect x="48" y="32" width="164" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1.3"/>
  <rect x="56" y="40" width="36" height="16" rx="2" fill="transparent" stroke="rgba(122,131,153,0.45)" stroke-width="1"/>
  <text x="74" y="52" fill="#7a8399" font-size="10" font-weight="600" font-family="'Consolas', 'Microsoft YaHei', monospace" text-anchor="middle" letter-spacing="0.08em">SRC</text>
  <text x="130" y="70" fill="#2d3142" font-size="16" font-weight="600" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" text-anchor="middle">场景三角形</text>
  <text x="130" y="88" fill="#4f5d75" font-size="12" font-family="'Consolas', 'Microsoft YaHei', monospace" text-anchor="middle">raw mesh data</text>

  
  <rect x="256" y="32" width="208" height="64" rx="6" fill="#f5f5f5"/>
  <rect x="256" y="32" width="208" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.3"/>
  <rect x="264" y="40" width="36" height="16" rx="2" fill="transparent" stroke="rgba(45,49,66,0.45)" stroke-width="1"/>
  <text x="282" y="52" fill="#2d3142" font-size="10" font-weight="600" font-family="'Consolas', 'Microsoft YaHei', monospace" text-anchor="middle" letter-spacing="0.08em">FAC</text>
  <text x="360" y="70" fill="#2d3142" font-size="16" font-weight="600" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" text-anchor="middle">Facet 场景</text>
  <text x="360" y="88" fill="#4f5d75" font-size="12" font-family="'Consolas', 'Microsoft YaHei', monospace" text-anchor="middle">color · normal · emission</text>

  
  <rect x="508" y="32" width="208" height="64" rx="6" fill="#f5f5f5"/>
  <rect x="508" y="32" width="208" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1.3"/>
  <rect x="516" y="40" width="36" height="16" rx="2" fill="transparent" stroke="rgba(79,93,117,0.55)" stroke-width="1"/>
  <text x="534" y="52" fill="#4f5d75" font-size="10" font-weight="600" font-family="'Consolas', 'Microsoft YaHei', monospace" text-anchor="middle" letter-spacing="0.08em">SDF</text>
  <text x="612" y="70" fill="#2d3142" font-size="16" font-weight="600" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" text-anchor="middle">SDF 场景</text>
  <text x="612" y="88" fill="#4f5d75" font-size="12" font-family="'Consolas', 'Microsoft YaHei', monospace" text-anchor="middle">3D distance field</text>

  
  <rect x="760" y="32" width="192" height="64" rx="6" fill="#f5f5f5"/>
  <rect x="760" y="32" width="192" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.3"/>
  <rect x="768" y="40" width="44" height="16" rx="2" fill="transparent" stroke="rgba(235,108,54,0.55)" stroke-width="1"/>
  <text x="790" y="52" fill="#eb6c36" font-size="10" font-weight="600" font-family="'Consolas', 'Microsoft YaHei', monospace" text-anchor="middle" letter-spacing="0.08em">CAS</text>
  <text x="856" y="70" fill="#2d3142" font-size="16" font-weight="600" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" text-anchor="middle">级联 SDF</text>
  <text x="856" y="88" fill="#4f5d75" font-size="12" font-family="'Consolas', 'Microsoft YaHei', monospace" text-anchor="middle">4 cascades · bricked sparse</text>

  
  <line x1="48" y1="120" x2="952" y2="120" stroke="rgba(45,49,66,0.08)" stroke-width="1"/>
  <text x="130" y="140" fill="#7a8399" font-size="11" font-family="'Consolas', 'Microsoft YaHei', monospace" text-anchor="middle">triangle data</text>
  <text x="360" y="140" fill="#7a8399" font-size="11" font-family="'Consolas', 'Microsoft YaHei', monospace" text-anchor="middle">rasterized to texture</text>
  <text x="612" y="140" fill="#7a8399" font-size="11" font-family="'Consolas', 'Microsoft YaHei', monospace" text-anchor="middle">per-voxel distance</text>
  <text x="856" y="140" fill="#7a8399" font-size="11" font-family="'Consolas', 'Microsoft YaHei', monospace" text-anchor="middle">near-fine · far-coarse</text>

  
  <line x1="48" y1="160" x2="952" y2="160" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
  <text x="48" y="180" fill="#4f5d75" font-size="11" font-weight="500" font-family="'Consolas', 'Microsoft YaHei', monospace" letter-spacing="0.18em">LEGEND</text>

  <rect x="148" y="170" width="16" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.3"/>
  <text x="172" y="180" fill="#4f5d75" font-size="11" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif">最终输出（级联 SDF）</text>

  <rect x="340" y="170" width="16" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1.3"/>
  <text x="364" y="180" fill="#4f5d75" font-size="11" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif">中间产物</text>

  <rect x="460" y="170" width="16" height="12" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1.3"/>
  <text x="484" y="180" fill="#4f5d75" font-size="11" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif">GPU 资源</text>

  <rect x="568" y="170" width="16" height="12" rx="2" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1.3"/>
  <text x="592" y="180" fill="#4f5d75" font-size="11" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif">原始数据</text>
</svg>
