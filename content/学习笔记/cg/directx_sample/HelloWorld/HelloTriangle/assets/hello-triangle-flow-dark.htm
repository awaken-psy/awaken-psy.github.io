<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>D3D12 HelloTriangle 整体流程与思维链路</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Instrument+Serif:ital@0;1&amp;family=Noto+Sans+SC:wght@400;500;600&amp;family=Noto+Serif+SC:wght@400&amp;display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #2d3142;
      --color-paper-2: #393e53;
      --color-ink: #f5f5f5;
      --color-muted: #bfc0c0;
      --color-soft: #8e98ac;
      --color-accent: #f08a59;
      --font-sans: 'Geist', 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif SC', 'SimSun', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
      background: var(--color-paper);
      color: var(--color-ink);
      font-family: var(--font-sans);
    }
    .frame { width: 100%; max-width: 1280px; }
    .eyebrow {
      margin-bottom: 8px;
      color: var(--color-muted);
      font-family: var(--font-mono);
      font-size: 8px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }
    h1 {
      margin-bottom: 24px;
      color: var(--color-ink);
      font-family: var(--font-serif);
      font-size: 28px;
      font-weight: 400;
      line-height: 1.2;
    }
    svg { width: 100%; min-width: 960px; display: block; }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">SWIMLANE · HELLOTRIANGLE RENDERING PATH</p>
